# FuhrerOS adaptive controller configuration (fuhrerd).
# Every value here is recorded in experiment metadata; change deliberately.
# See docs/decisions.md for the rationale behind each default.

# adaptive | observe | off | static:normal | static:batched | static:specialized
# (the kernel parameter fuhrer.mode=... overrides this at boot)
mode = adaptive

# Sampling period (D-004) and switching damping (D-005).
interval_ms  = 1000
hysteresis   = 3
min_dwell_ms = 3000

# Per-process attribution (PID/COMM in [ADAPT] logs). 0 lowers overhead.
scan_procs = 1

# Workload class -> policy (D-006). Validate with M5 static benchmarks.
map.IDLE          = normal
map.INTERACTIVE   = normal
map.CPU_BOUND     = batched
map.IO_SEQUENTIAL = batched
map.IO_RANDOM     = specialized
map.NETWORK_HEAVY = specialized
map.MIXED         = normal

# Classifier thresholds (D-008).
cpu_bound_pct     = 80
io_active_iops    = 200
io_active_mbps    = 8
app_io_active_ops = 5000
small_io_kb       = 16
large_io_kb       = 128
seq_merge_ratio   = 0.4
net_active_pps    = 3000
net_active_mbps   = 5
interactive_ctxsw = 500
