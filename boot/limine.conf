# FuhrerOS boot menu (Limine). @CMDLINE@/@TIMEOUT@ are filled in by the Makefile.
timeout: @TIMEOUT@
interface_branding: FuhrerOS
interface_branding_colour: 6

/FuhrerOS
    protocol: limine
    path: boot():/boot/fuhreros.elf
    cmdline: @CMDLINE@
    module_path: boot():/boot/initrd.tar
    module_string: initrd

/FuhrerOS (text console)
    protocol: limine
    path: boot():/boot/fuhreros.elf
    cmdline: console
    module_path: boot():/boot/initrd.tar
    module_string: initrd

/FuhrerOS (self-test)
    protocol: limine
    path: boot():/boot/fuhreros.elf
    cmdline: test usertest
    module_path: boot():/boot/initrd.tar
    module_string: initrd
